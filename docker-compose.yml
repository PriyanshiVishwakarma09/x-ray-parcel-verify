version: '3.8'

services:
  x-ray-verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: x-ray-parcel-verify:latest
    container_name: x-ray-parcel-verify-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEVICE=cpu
      - CONF_THRESH=0.68
      - TORCH_THREADS=2
    volumes:
      # Persistent volume for results generated by the container
      - parcel_results:/app/static/my_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  parcel_results:
    driver: local

